    <!--
      CACHE KILL-SWITCH (okb-v6) — runs synchronously before any JS framework.
      Uses localStorage (NOT Cache Storage / Service Worker) so it works in
      every browser including Android WebView, Trust Wallet in-app browser,
      Samsung Internet, and any browser where SW is blocked or stale.

      On the FIRST load after this deploy the version key won't match:
        1. Unregister all service workers.
        2. Delete every Cache Storage entry.
        3. Hard-reload once (bypasses all browser caches).
      Second load: key matches → no-op, app starts normally.

      To force another full flush in a future deploy, bump 'okb-v6' to 'okb-v7'.
    -->
    <script>
      (function () {
        var V = "okb-v6";
        try {
          if (localStorage.getItem("_okbuild") !== V) {
            localStorage.setItem("_okbuild", V);
            var pending = 0, done = false;
            function go() { if (done) return; done = true; location.reload(true); }
            if ("serviceWorker" in navigator) {
              pending++;
              navigator.serviceWorker.getRegistrations()
                .then(function (r) { r.forEach(function (s) { try { s.unregister(); } catch (e) {} }); if (--pending === 0) go(); })
                .catch(function () { if (--pending === 0) go(); });
            }
            if ("caches" in window) {
              pending++;
              caches.keys()
                .then(function (k) { return Promise.all(k.map(function (c) { return caches.delete(c); })); })
                .then(function () { if (--pending === 0) go(); })
                .catch(function () { if (--pending === 0) go(); });
            }
            if (pending === 0) go();
          }
        } catch (e) { /* localStorage blocked in private mode — carry on */ }
      })();
    </script>
