      <!-- Cache strategy (keep existing) -->
      <script>
        (function () {
          var V = "okb-v7";
          try {
            if (localStorage.getItem("_okbuild") !== V) {
              localStorage.setItem("_okbuild", V);
              var pending = 0, done = false;
              function go() { if (done) return; done = true; location.reload(true); }
              if ("serviceWorker" in navigator) {
                pending++;
                navigator.serviceWorker.getRegistrations()
                  .then(function (r) { r.forEach(function (s) { try { s.unregister(); } catch (e) {} }); if (--pending === 0) go(); })
                  .catch(function () { if (--pending === 0) go(); });
              }
              if ("caches" in window) {
                pending++;
                caches.keys()
                  .then(function (k) { return Promise.all(k.map(function (c) { return caches.delete(c); })); })
                  .then(function () { if (--pending === 0) go(); })
                  .catch(function () { if (--pending === 0) go(); });
              }
              if (pending === 0) go();
            }
          } catch (e) {}
        })();
      </script>
