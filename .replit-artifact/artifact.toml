kind = "slides"
previewPath = "/orakzai-bond/"
title = "Orakzai Bond – Marketing Deck"
version = "1.0.0"
id = "artifacts/orakzai-bond"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/orakzai-bond/" ]
localPort = 26128

[services.development]
run = "pnpm --filter @workspace/orakzai-bond run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orakzai-bond", "run", "build" ]
publicDir = "artifacts/orakzai-bond/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26128"
BASE_PATH = "/orakzai-bond/"
